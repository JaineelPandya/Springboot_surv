spring:
  application:
    name: surveillance-platform
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/surveillance_db}
    username: ${DB_USERNAME:surveillance_user}
    password: ${DB_PASSWORD:surveillance_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,flyway,loggers
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    redis:
      enabled: true
    db:
      enabled: true
  info:
    env:
      enabled: true
    java:
      enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    tags-sorter: alpha
    operations-sorter: alpha
  show-actuator: false

info:
  app:
    name: ${spring.application.name}
    version: 1.0.0
    description: Confidential Document Surveillance and Compliance Monitoring Platform

logging:
  level:
    root: INFO
    com.surv.platform: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSZ} [%thread] %-5level [%X{traceId},%X{spanId}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSZ} [%thread] %-5level [%X{traceId},%X{spanId}] %logger{36} - %msg%n"
  file:
    name: logs/surveillance-platform.log

app:
  jwt:
    secret: ${JWT_SECRET:CHANGE_ME_IN_PRODUCTION_USE_AT_LEAST_32_CHARS_LONG_SECRET_KEY_HERE}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRY_MS:900000}
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRY_MS:604800000}
    issuer: surveillance-platform
  storage:
    base-path: ${STORAGE_PATH:/tmp/surveillance-storage}
  google:
    gmail:
      client-id: ${GOOGLE_CLIENT_ID:mock-google-client-id}
      client-secret: ${GOOGLE_CLIENT_SECRET:mock-google-client-secret}
      redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/v1/integrations/gmail/oauth2/callback}
      pub-sub-topic-name: ${GOOGLE_PUBSUB_TOPIC:projects/mock-gcp-project/topics/gmail-notifications}
      encryption-key: ${GMAIL_TOKEN_ENCRYPTION_KEY:0123456789abcdef0123456789abcdef}
      auto-renew-watches: true
      watch-renewal-threshold-hours: 24
      periodic-reconciliation-enabled: true

spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: ${MAX_FILE_SIZE:50MB}
      max-request-size: ${MAX_REQUEST_SIZE:55MB}
